name: Refresh README TODO list

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/refresh_todo_list.py'
      - '.github/workflows/refresh-todo-list.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh TODO section
        run: python3 .github/scripts/refresh_todo_list.py

      - name: Show README diff
        run: git diff -- README.md | head -n 260

      - name: Commit and push update
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update complete TODO list for dev changes"
            git push origin HEAD:dev
          fi
